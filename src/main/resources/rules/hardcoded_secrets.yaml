version: "1.0"
category: "secrets"

rules:
  - id: hardcoded_api_key
    severity: high
    name: "Hardcoded API Key"
    description: "String constant that resembles an API key or secret token"
    match:
      type: string_contains
      patterns:
        - "api_key"
        - "apiKey"
        - "API_KEY"
        - "api_secret"
        - "apiSecret"
    tags: ["cwe-798", "owasp-m9"]

  - id: hardcoded_password
    severity: critical
    name: "Hardcoded Password"
    description: "String constant that may be a hardcoded password"
    match:
      type: string_contains
      patterns:
        - "password ="
        - "passwd ="
        - "\"password\""
    tags: ["cwe-798"]

  - id: hardcoded_crypto_key
    severity: critical
    name: "Hardcoded Encryption Key"
    description: "SecretKeySpec constructed with literal bytes or string"
    match:
      type: pattern
      all:
        - method_invoke: "javax.crypto.spec.SecretKeySpec.<init>"
        - has_literal_arg: true
    tags: ["cwe-798", "owasp-m5"]

  - id: base64_encoded_secret
    severity: medium
    name: "Base64-encoded Secret"
    description: "Long Base64-encoded string that may be an embedded secret"
    match:
      type: string_contains
      patterns:
        - "Base64.decode"
        - "Base64.getDecoder"
    tags: ["cwe-798"]

  - id: hardcoded_iv
    severity: high
    name: "Hardcoded Initialization Vector"
    description: "IvParameterSpec constructed with static bytes"
    match:
      type: method_invoke
      target: "javax.crypto.spec.IvParameterSpec.<init>"
    tags: ["cwe-329"]

  - id: firebase_key_exposed
    severity: medium
    name: "Firebase Key in Code"
    description: "Firebase API key or project config hardcoded in source"
    match:
      type: string_contains
      patterns:
        - "AIzaSy"
        - "firebase"
    tags: ["cwe-798"]
