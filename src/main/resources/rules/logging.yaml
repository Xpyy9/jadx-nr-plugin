version: "1.0"
category: "logging"

rules:
  - id: sensitive_log
    severity: medium
    name: "敏感信息日志输出"
    description: "Log.d/i/v 可能输出敏感信息到 logcat"
    match:
      type: pattern
      any:
        - string_contains: "Log.d("
        - string_contains: "Log.v("
        - string_contains: "Log.i("
    tags: ["cwe-532"]

  - id: exception_stacktrace
    severity: medium
    name: "异常栈打印"
    description: "printStackTrace() 在生产环境泄露内部实现细节"
    match:
      type: string_contains
      value: "printStackTrace()"
    tags: ["cwe-209"]
